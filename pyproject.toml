[project]
name = "ats-checker"
version = "0.1.0"
description = "Local ATS simulator and resume checker for software engineering roles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "plotext>=5.2,<6",
    "pdfplumber>=0.11",
    "pypdf>=4.2",
    "pdfminer.six>=20231228",
    "textstat>=0.7.3",
    "rapidfuzz>=3.9",
    "python-dateutil>=2.9",
    "platformdirs>=4.2",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]

[project.scripts]
ats = "ats_checker.cli:app"

[dependency-groups]
dev = ["pytest>=8", "reportlab>=4.2", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ats_checker"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
